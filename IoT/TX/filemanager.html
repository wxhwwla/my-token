<!DOCTYPE html>
<!-- filemanager html -->

<html>

    <head>
        <meta charset="utf-8">
    </head>

    <body>

        <h1>
            文件管理
        </h1>

        <table>
            <tr>
                <th>文件名</th>
                <th>换算后大小</th>
                <th>字节大小</th>
            </tr>
            __FILES__
        </table>

        <form method="POST" action="/upload" enctype="multipart/form-data">

            <input type="file" name="file">

            <button type="submit">
                上传
            </button>

        </form>

        <form method="POST" action="/delete">

            <input type="text" name="file" placeholder="输入要删除的文件名">

            <button type="submit">
                删除
            </button>

        </form>
    </body>

</html>
